<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">SiteLens 站点透视 — 验证型 Web 站点安全评估平台</title>
  <desc id="heroDesc">输入网址，输出可复现的验证结论：左为项目名与承诺，右为一条带 curl 复现命令的真实发现证据卡。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#16233b" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)" opacity=".5"/>

  <!-- 左：品类语境 → 项目名 → 具体承诺 → 证明 -->
  <text x="64" y="86" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18" fill="#5eead4">验证型 WEB 站点安全评估 · GO 单二进制 · 零外部依赖</text>
  <text x="64" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="64" font-weight="800" fill="#f1f5f9">SiteLens 站点透视</text>
  <text x="64" y="212" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="24" fill="#e2e8f0">输入网址，输出可复现的验证结论</text>
  <text x="64" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#64748b">372 指纹 · 11024 漏洞情报 · 5400+ 模板 · 每条发现带证据链</text>
  <text x="64" y="298" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="16" fill="#475569">靶场实测：DVWA LFI 读到 /etc/passwd · 干净站零误报 ×2 · govulncheck 零漏洞</text>

  <!-- 分隔竖线 -->
  <rect x="660" y="80" width="1" height="200" fill="#24365a"/>

  <!-- 右：真实证据卡（一条布尔盲注发现） -->
  <rect x="704" y="76" width="432" height="212" rx="12" fill="#101b2f" stroke="#24365a"/>
  <rect x="728" y="100" width="58" height="26" rx="5" fill="#7f1d1d"/>
  <text x="757" y="118" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#fecaca">HIGH</text>
  <text x="800" y="119" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="20" fill="#e2e8f0">布尔盲注（差分确认）</text>
  <text x="728" y="152" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" fill="#64748b">真 payload 1000B ≈ 基线</text>
  <text x="728" y="176" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" fill="#64748b">假 payload  400B 显著偏离</text>
  <rect x="722" y="192" width="396" height="76" rx="8" fill="#0b1220"/>
  <text x="738" y="218" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" fill="#5eead4">$ curl -sk --path-as-is \</text>
  <text x="738" y="244" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" fill="#5eead4">  'https://target.example.com/v?id=1…'</text>
  <text x="728" y="316" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="16" fill="#94a3b8">二次确认 · 证据可核对 · 命令可复现</text>

  <!-- 底部渐变线 -->
  <rect x="0" y="344" width="1200" height="4" fill="url(#teal)" opacity=".7"/>
</svg>
