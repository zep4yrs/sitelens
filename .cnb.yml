#   后引擎永远起不来（v3.0.0 真实事故，且被壳的配置写入错误掩盖）。
#   本地在 Windows 上构建产物必为 PE，且可在打包前后即时验证平台。
#
# 现在的发版流程（本地）：
#   改 desktop/package.json 版本号 → tools/release_local.sh [--publish]
#   脚本：构建引擎（显式 GOOS=windows + PE 魔数校验）→ 打包 NSIS → 可选上传 CNB。
#   更新源仍唯一在 GitHub desktop-stable（手工同步三件套）。
