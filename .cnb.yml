

.main: &regression
  docker:
    image: golang:1.26.8
  stages:
    - name: gofmt 格式检查
      script:
        # 独立步骤：失败信息只指向格式问题，不与 vendor 检查混在一条链里
        #（曾经把排查方向带偏：真正失败在 gofmt，兜底文案却喊 vendor）
        - test -z "$(gofmt -l internal/ cmd/)" || { echo "× 以下文件未过 gofmt，本地 gofmt -w 后提交："; gofmt -l internal/ cmd/; exit 1; }
    - name: 引擎回归
      script:
        - go vet ./...
        - go mod verify
        # vendor 一致性门禁：仓库里 go.mod 与 vendor 脱节（只提交依赖改动漏跑
        # go mod vendor）会在此红掉，本地补跑 tidy+vendor 一并提交即可
        - go mod tidy && go mod vendor && git diff --exit-code -- go.mod go.sum vendor/ || { echo "× vendor 与 go.mod 不同步：本地执行 go mod tidy && go mod vendor 后一并提交"; exit 1; }
        - go test -count=1 ./internal/... ./cmd/...
        - go test -race -count=1 ./internal/... # 实抓过 2 次 race（测试桩并发），列为阻断门禁
        - go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
    - name: 前端转义回归
      script:
        - apt-get update -qq && apt-get install -y -qq nodejs >/dev/null
        - node --test web/js/esc.test.mjs web/js/scan-options.test.mjs # 转义回归 + 三维选择器映射单测
        - node --test tools/ci_pipeline_guard.test.mjs # CI 配置门禁：wine 调用必须套 xvfb-run（tag 构建曾在此红）
        - cd desktop && node --test # 桌面壳单测：配置合并器 + 端口决策（逻辑最密层；无参自动发现）

main:
  push:
    - *regression
  pull_request:
    - *regression

# 发版构建（tag 推送触发）。日常提交不自动构建。发版流程：
#   模板池与情报库均已入仓库（packs/ 与 data/），推送版本 tag 即自动构建
#   桌面版安装包并上传到版本 release。CNB 不做自动更新源（用户拍板）：
#   desktop-stable 更新源在 GitHub，唯一来源。
#   4.0 起只保留桌面版单一交付形态：引擎裸包（lite/full/linux zip）已按
#   用户要求移除——桌面壳即产品（2026-09-13）。

