

.main: &regression
  docker:
    image: golang:1.26.8
  stages:
    - name: 引擎回归
      script:
        - gofmt -l internal/ cmd/ && test -z "$(gofmt -l internal/ cmd/)"
        - go vet ./...
        - go mod verify
        # vendor 一致性门禁：仓库里 go.mod 与 vendor 脱节（只提交依赖改动漏跑
        # go mod vendor）会在此红掉，本地补跑 tidy+vendor 一并提交即可
        - go mod tidy && go mod vendor && git diff --exit-code -- go.mod go.sum vendor/ || { echo "× vendor 与 go.mod 不同步：本地执行 go mod tidy && go mod vendor 后一并提交"; exit 1; }
        - go test -count=1 ./internal/... ./cmd/...
        - go test -race -count=1 ./internal/... # 实抓过 2 次 race（测试桩并发），列为阻断门禁
        - go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
    - name: 前端转义回归
      script:
        - apt-get update -qq && apt-get install -y -qq nodejs >/dev/null
        - node --test web/js/esc.test.mjs web/js/scan-options.test.mjs # 转义回归 + 三维选择器映射单测
        - cd desktop && node --test # 桌面壳单测：配置合并器 + 端口决策（逻辑最密层；无参自动发现）

main:
  push:
    - *regression
  pull_request:
    - *regression

# 发版构建（tag 推送触发）。日常提交不自动构建。发版流程：
#   模板池与情报库均已入仓库（packs/ 与 data/），推送 v3.0.0 tag 即自动构建
#   5 产物 + 桌面版三件套并上传；桌面包同步发布到 desktop-stable 标签，
#   作为已装客户端的自动更新源（electron-updater generic）。
"v*":
  tag_push:
    - name: 构建桌面版（Electron 壳，双发布到版本 release 与 desktop-stable 更新源）
      docker:
        image: golang:1.26.8
      stages:
        - name: build
          script:
            - |
              # 镜像变量前置导出：electron-builder 自取的 electron zip 与
              # 打包工具链都走 npmmirror（直连 github 在部分网络不稳）
              export ELECTRON_SKIP_BINARY_DOWNLOAD=1
              export ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/
              export ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/
              export CSC_IDENTITY_AUTO_DISCOVERY=false
              # Wine：Linux 上打 Windows NSIS 安装包必需（electron-builder 会用
              # wine 跑 makensis.exe 生成卸载器）。makensis.exe 是 32 位 PE，
              # 所以 wine32 必须装（仅 wine64 会以 wow64 模式加载
              # C:\windows\syswow64\ntdll.dll 失败：c0000135）。
              # USE_SYSTEM_WINE=true 让 electron-builder 直接用系统 wine，跳过
              # 它自带的工具集下载（国内直连 github 不稳，且其 wine-4.0.1-mac 包
              # 在 Linux 上会 spawn 失败）。
              export USE_SYSTEM_WINE=true
              export WINEARCH=win64
              export WINEDEBUG=-all
              # Node 22：electron 44 / electron-builder 26 工具链要求 >=22.12
              # （基础镜像自带 node 20，此处补装满足 engine 要求的版本）
              dpkg --add-architecture i386
              apt-get update -qq && apt-get install -y -qq zip jq curl >/dev/null
              apt-get install -y -qq --no-install-recommends wine wine64 wine32:i386 >/dev/null
              curl -fsSL https://deb.nodesource.com/setup_22.x | bash - >/dev/null
              apt-get install -y -qq nodejs >/dev/null
              # 预热 wine prefix（首次运行会创建 ~/.wine，可能耗时数十秒）
              wineboot --init >/dev/null 2>&1 || true
              cd desktop
              npm ci --no-audit --no-fund
              node --test
              npm run engine
              # signAndEditExecutable=false：跳过 exe 图标/元数据写入与代码签名。
              # 该步骤由 electron-builder 的 rcedit 完成，Linux 上同样经 wine 调用；
              # 本项目安装包未做代码签名（README「已知边界」），跳过它可省一轮 wine
              # 调用、降低无显示驱动环境的失败面。产物功能性不受影响，仅 exe 不写
              # 入自定义图标与版本资源。
              npx electron-builder --win nsis --publish never -c.win.signAndEditExecutable=false
              cd ..
              bash tools/release_upload.sh desktop/release/SiteLens-Setup-3.0.0.exe
              SITLENS_TAG=desktop-stable bash tools/release_upload.sh desktop/release/SiteLens-Setup-3.0.0.exe
              SITLENS_TAG=desktop-stable bash tools/release_upload.sh desktop/release/SiteLens-Setup-3.0.0.exe.blockmap
              SITLENS_TAG=desktop-stable bash tools/release_upload.sh desktop/release/latest.yml
    - name: 构建 Windows lite（zip + NSIS 安装器）
      docker:
        image: golang:1.26.8
      stages:
        - name: build
          script:
            - apt-get update -qq && apt-get install -y -qq zip jq nsis >/dev/null
            - export SITLENS_BODY_FILE="$PWD/tools/release-body-3.0.0.md"
            - GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o SiteLens/sitelens.exe ./cmd/sitelens
            - mkdir -p SiteLens/data
            - cp -r data/go SiteLens/data/go
            - cp -r data/wordlists SiteLens/data/wordlists
            - cp data/affected_ranges.json SiteLens/data/affected_ranges.json
            - cp README.md docs/产品说明.md SiteLens/ 2>/dev/null || true
            - mkdir -p dist
            - (cd SiteLens && zip -qr ../dist/SiteLens-3.0.0-lite-win64.zip .)
            # LANG=C.UTF-8 必须设置：C locale 下 makensis 对中文文件名（产品说明.md）会段错误
            - LANG=C.UTF-8 LC_ALL=C.UTF-8 makensis -V2 -DVERSION=3.0.0 -DSRCDIR="$PWD" -DSTAGEDIR=SiteLens -DOUTFILE="$PWD/dist/SiteLens-3.0.0-setup-lite.exe" installer/installer.nsi
            - SITLENS_BODY_FILE="$PWD/tools/release-body-3.0.0.md" bash tools/release_upload.sh dist/SiteLens-3.0.0-lite-win64.zip
            - SITLENS_BODY_FILE="$PWD/tools/release-body-3.0.0.md" bash tools/release_upload.sh dist/SiteLens-3.0.0-setup-lite.exe
    - name: build-linux
      docker:
        image: golang:1.26.8
      stages:
        - name: build
          script:
            - apt-get update -qq && apt-get install -y -qq zip jq >/dev/null
            - mkdir -p dist
            - GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -o dist/sitelens-linux-amd64 ./cmd/sitelens
            - (cd dist && zip -q SiteLens-3.0.0-linux-amd64.zip sitelens-linux-amd64)
            - SITLENS_BODY_FILE="$PWD/tools/release-body-3.0.0.md" bash tools/release_upload.sh dist/SiteLens-3.0.0-linux-amd64.zip
    - name: 构建 Windows full 完整版（zip + NSIS 安装器，含情报库）
      docker:
        image: golang:1.26.8
      stages:
        - name: build
          script:
            - |
              # 模板池与情报库均已入仓库（packs/nuclei-templates.tar.gz + data/），
              # full 构建零外部资产依赖
              apt-get update -qq && apt-get install -y -qq zip nsis jq >/dev/null
              export SITLENS_BODY_FILE="$PWD/tools/release-body-3.0.0.md"
              mkdir -p SiteLens/data/nuclei SiteLens/data dist
              tar --no-same-owner -xzf packs/nuclei-templates.tar.gz -C SiteLens/data/nuclei
              cp data/intel_dump.json.gz data/tpl_intel.json.gz data/affected_ranges.json SiteLens/data/ 2>/dev/null || true
              cp -r data/go data/wordlists SiteLens/data/ 2>/dev/null || true
              GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o SiteLens/sitelens.exe ./cmd/sitelens
              cp README.md docs/产品说明.md SiteLens/ 2>/dev/null || true
              (cd SiteLens && zip -qr ../dist/SiteLens-3.0.0-full-win64.zip .)
              # LANG=C.UTF-8 必须设置：C locale 下 makensis 对中文文件名（产品说明.md）会段错误
              LANG=C.UTF-8 LC_ALL=C.UTF-8 makensis -V2 -DVERSION=3.0.0 -DSRCDIR="$PWD" -DSTAGEDIR=SiteLens -DOUTFILE="$PWD/dist/SiteLens-3.0.0-setup-full.exe" installer/installer.nsi
              # full 产物上传到本私有仓库 Release（仅协作者可见；intel_dump 不入 git）
              SITLENS_BODY_FILE="$PWD/tools/release-body-3.0.0.md" bash tools/release_upload.sh dist/SiteLens-3.0.0-full-win64.zip
              SITLENS_BODY_FILE="$PWD/tools/release-body-3.0.0.md" bash tools/release_upload.sh dist/SiteLens-3.0.0-setup-full.exe
