<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>批量扫描 — SiteLens</title>
<script src="/js/turbo.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>if(localStorage.getItem("sitelens-theme")==="dark")document.documentElement.classList.add("dark")</script>
<style>
  .count-row{display:flex;align-items:center;gap:14px;margin-top:12px}
  .count-row .n{font-family:var(--font-mono);font-size:13px;color:var(--muted-fg)}
  .log-box{margin-top:16px;background:var(--card);border:1px solid var(--border);border-radius:10px;
    padding:14px 18px;font-family:var(--font-mono);font-size:12.5px;line-height:2.1;
    max-height:340px;overflow-y:auto;word-break:break-all;display:none}
  .log-box .ok{color:var(--ok)}
  .log-box .fail{color:var(--danger)}
</style>
</head>
<body>
<script src="/js/common.js"></script>

<div class="tw-app">
  <div class="tw-right">
    <div class="tw-toolbar">
      <span class="tw-pagetitle">批量扫描</span>
      <div class="tw-topslot" id="tw-topslot"></div>
    </div>
    <div class="tw-canvas">
      <main class="page">
  <p class="sub">每行一个 URL，上限随 batch.max_urls 配置（默认 50）。3 线程并发逐个扫描并入库，完成后可在历史页导出宽表 CSV。</p>

  <textarea class="batch-box" id="batch-urls" placeholder="https://example.com&#10;https://www.python.org&#10;https://books.toscrape.com"></textarea>
  <div class="count-row">
    <button class="btn" id="batch-go" onclick="startBatch()">▶ 开始批量扫描</button>
    <button class="btn ghost" id="batch-cancel" onclick="cancelBatch()" style="display:none">取消</button>
    <span class="n" id="batch-n">-</span>
    <span class="hint" style="margin:0" id="batch-hint"></span>
  </div>

  <div class="progressbar" id="batch-pw" style="display:none;max-width:520px"><i id="batch-bar"></i></div>
  <div class="log-box" id="batch-log"></div>
      </main>
    </div>
  </div>
</div>

<script src="/js/batch.js"></script>
</body>
</html>
