# SiteLens 配置示例：复制为 .sitelens.yml 后按需修改。
# 所有键均可省略——未设置（或负值）的项自动回退内置最佳实践默认值；
# 布尔项的 false 是合法的"关"，不会被回退。
# 完整键位语义见 README「配置」节。

scan:
  rate_interval_ms: 400      # 请求最小间隔（限速）
  timeout_sec: 15            # 单请求超时
  max_hops: 6                # 重定向跳数上限
  max_body_mb: 3             # 正文留存上限
  deep: true                 # 默认同域浅爬取
  resolve: true              # SSRF DNS 校验（内网授权靶场可关）
  max_concurrent: 3          # 并发扫描任务数

target:
  allow_private: false       # 允许扫描私网/本机地址（授权靶场才开，安全闸默认关）

checks:
  level: all                 # none | core | all
  plugin_dir: data/plugins   # 用户自定义 check（JSON 数组，热加载）
  nuclei_cap: 300            # Nuclei 子集数量上限
  nuclei_dir: data/nuclei    # 模板库目录（不存在自动跳过）

crawler:
  max_pages: 40
  respect_robots: true
  max_links_per_page: 80
  timeout_sec: 60

  headless: false             # 无头渲染（SPA 支持；需本机 Chrome/Chromium，缺失自动降级）
  headless_all_pages: false   # 渲染扩展到全部已爬页（默认仅首页；页面多时显著变慢）
  headless_timeout_sec: 20
dast:
  max_params: 24
  time_blind: true
  bool_blind: true
  blind_threshold_ms: 3500
  sleep_seconds: 4
  max_url_len: 2048
  # 深度探测面（默认全开）：SSTI / 命令注入 / CRLF / NoSQL / XPath /
  # LDAP / 表达式注入 / JNDI(Log4Shell) / XXE / 上传受理面 / Cookie-头注入
  deep_probes: true          # 总闸（关则只跑核心四类）
  cmd_inject: true           # 命令注入时间差分（重类，单列可关）
  crlf: true                 # CRLF 响应头注入
  error_status: true         # 报错状态差分（注入引号后 2xx→5xx 判定，
                             # 覆盖只回通用 500 页、无数据库报错回显的目标）
  max_probes_per_class: 12   # 单类探针上限（防重类吃满预算）
  random_diff: true          # 会话载体随机差分（同一 URL 两次取样，
                             # 时间戳/短整数形态的会话标识命中）
  stored_xss: true           # 存储型 XSS：写无害标记 → 跨请求读回
                             # （反射通道看不见"写进去、别处读出来"）
  cache_hygiene: true        # 敏感页缓存卫生（会话页缺 no-store 判定）
  weak_cookie: true          # 状态变更表单下发弱会话 Cookie（值形态判定，
                             # 覆盖 DVWA Weak Session IDs 这类"提交按钮
                             # 生成会话 ID"的模块）

intel:
  dump_path: data/intel_dump.json.gz
  ranges_path: data/affected_ranges.json
  technologies_path: data/go/technologies.json
  search_limit: 40
  update_hours: 24           # KEV 自动更新间隔（0 = 关闭）

netsec:
  tls_timeout_sec: 8
  mail_check: true

oob:                         # 出带回调（SSRF/盲 XSS/XXE 外发）——默认关
  enabled: false             # 主动外发，需显式开启并自备接收端
  mode: callback             # callback（轮询接收端日志）| csv（读本地落盘）
  callback: ""               # callback 模式的日志拉取地址（GET，返回命中记录）
  csv_path: ""               # csv 模式落盘路径（供外部 dnslog/oast 同步）
  token_host: ""             # 触发用回调域名，如 <id>.oast.pro / <id>.dnslog.cn
  max_probes: 12             # 单扫描探测参数上限

loginbrute:                  # 仅限授权目标；前端需勾选授权确认
  max_tries: 400
  max_users: 8
  max_passwords: 50
  interval_ms: 150
  captcha_ocr_url: ""        # ddddocr sidecar（python tools/ocr_server.py），空 = 验证码页直接报错
  # max_concurrent 为保留键：爆破刻意顺序执行（降低触发账户锁定风险）

audit:
  max_archive_mb: 20
  max_files: 800
  max_file_kb: 512
  max_findings_per_rule: 50

batch:
  max_urls: 50
  workers: 3

web:
  listen: 127.0.0.1:5000     # 旧 Python 服务占用 5000 时可改端口
  api_token: ""              # 非空则 /api/* 需 X-Token（也可用环境变量 SLENS_API_TOKEN）
  history_limit: 50
  history_cap: 200
  shutdown_sec: 5

store:
  data_dir: data/state       # history.json / kev_extra.json / nuclei 索引缓存
  max_records: 500

active:                      # 主动模块阈值（模块本身默认关，扫描请求内指定）
  dir_max_paths: 300
  dir_bypass_403: false      # 403 绕过重试（伪造来源头）
  sub_max_words: 2000
  sub_workers: 20
  shell_max_paths: 200
  fp_max_requests: 30
  takeover_max: 50         # 子域名接管探测候选上限
  probe_ports: []            # 空 = 内置常见端口集
  probe_timeout_ms: 2500
  probe_workers: 10
  wordlist_dir: data/wordlists

ml:                          # 5.0 内嵌 ML 推理（cve-tech/cwe-type，先验参考不改变判定）
  predict: true              # 扫描收尾对含 CVE 的发现做产品 Top-5 + CWE 类型预测（总闸）
  assets_dir: data/go/ml_assets  # 模型资产目录；缺失静默跳过预测，损坏本进程禁用

